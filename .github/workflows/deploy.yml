name: Build, validate, and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Sync events from Google Calendar
        run: python3 scripts/sync_calendar_events.py

      - name: Sync events from the HCPSS Special Education calendar
        run: python3 scripts/sync_hcpss_calendar.py

      - name: Sync afterschool-program flyers from assets/flyers/before-after-school
        run: python3 scripts/sync_afterschool_flyers.py

      - name: Sync fundraiser flyers from assets/flyers/fundraising
        run: python3 scripts/sync_fundraiser_flyers.py

      - name: Sync PTA meeting flyers from assets/flyers/pta-meetings
        run: python3 scripts/sync_pta_meeting_flyers.py

      - name: Archive expired announcements and featured event pages
        # Moves anything past its `expires` date out of
        # config/announcements.json / config/event-pages.json (and its
        # flyer out of assets/flyers/) into archive/, which is never
        # deployed — see scripts/archive_expired.py. Also in
        # sync-events.yml: keep the two in sync.
        run: python3 scripts/archive_expired.py

      - name: Build pages from config
        run: python3 src/build.py

      - name: Validate generated pages
        run: python3 test/validate_build.py

      - name: Commit regenerated pages back to the repo (if changed)
        run: |
          git config user.name "thespta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A pages/ config/events.json config/pta-meeting-occurrences.json config/fundraiser-occurrences.json config/hcpss-family-events.json config/afterschool-programs.json config/fundraisers.json config/pta-meetings.json config/announcements.json config/event-pages.json assets/flyers/ archive/
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync content, regenerate pages [skip ci]"
            git push
          else
            echo "No changes to pages/ or the synced config files — nothing to commit."
          fi

      - name: Assemble the deployed site
        run: |
          mkdir -p site/images site/flyers
          cp -r pages/. site/
          find assets/images -maxdepth 1 -type f ! -name "*.md" -exec cp {} site/images/ \;
          cp -r assets/flyers/. site/flyers/

      # This workflow file is pushed identically to techmaster-thespta/thespta
      # (production) and techmaster-thespta/thespta-prestage (staging preview)
      # — see docs/SOP.md and CLAUDE.md's "Staging" note. src/build.py has no
      # way to know which one it's building for, so it always generates the
      # real, production sitemap.xml/robots.txt/canonical URLs (correct for
      # prod, and harmless — even helpful — left as-is on staging, since a
      # canonical link pointing at the real domain tells a search engine
      # which copy is authoritative if it ever finds both). What must differ
      # is whether the copy actually being deployed is *allowed* to be
      # indexed at all — so this step, gated on github.repository (set by
      # GitHub Actions itself, not something either repo's own files
      # control), overwrites robots.txt with a blanket disallow and stamps
      # a noindex meta tag onto every page, but only when this exact same
      # workflow file happens to be running inside the staging repo.
      - name: Block search/AI indexing on the staging mirror
        if: github.repository == 'techmaster-thespta/thespta-prestage'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          find site -name '*.html' -exec sed -i 's#</head>#<meta name="robots" content="noindex, nofollow">\n</head>#' {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
