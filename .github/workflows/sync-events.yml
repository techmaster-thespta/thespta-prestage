name: Sync events from Google Calendar

# A separate, self-contained hourly pipeline (distinct from deploy.yml's
# push-triggered one) so the Home/Events highlight lists and the PTA
# Meetings page's "Upcoming" section catch up with calendar changes
# within the hour even when nobody pushes a code change.
#
# This has to do its own full build+validate+deploy rather than just
# committing config/events.json and counting on deploy.yml's `push`
# trigger to pick it up: GitHub Actions never lets a GITHUB_TOKEN-authored
# push trigger another workflow (loop-prevention by design — see
# https://docs.github.com/en/actions/concepts/security/github_token), so
# that handoff would silently never fire.
#
# To avoid redeploying every single hour when the calendar hasn't
# actually changed, everything past the sync step is skipped unless
# config/events.json, config/pta-meeting-occurrences.json, or
# config/hcpss-family-events.json actually differs — or an announcement
# or featured event page just expired and got archived (see the
# "Archive expired..." step), which has to redeploy the same hour so the
# expired page actually comes down — the three can
# diverge independently (e.g. a PTA meeting rolls into or out of its own
# longer lookahead window, or HCPSS's separate calendar changes, without
# any other event changing).

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"  # shared with deploy.yml — both deploy to Pages and must not run at once
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Sync events from Google Calendar
        run: python3 scripts/sync_calendar_events.py

      - name: Sync events from the HCPSS Special Education calendar
        run: python3 scripts/sync_hcpss_calendar.py

      - name: Archive expired announcements and featured event pages
        # Moves anything past its `expires` date out of
        # config/announcements.json / config/event-pages.json (and its
        # flyer out of assets/flyers/) into archive/, which is never
        # deployed — see scripts/archive_expired.py. Also in
        # sync-events.yml: keep the two in sync.
        run: python3 scripts/archive_expired.py

      - name: Check whether the calendar (or an expiry) actually changed anything
        id: diff
        run: |
          # `git status --porcelain` rather than `git diff --quiet`: an
          # archive run *creates* files under archive/, and untracked
          # files are invisible to git diff.
          if [ -z "$(git status --porcelain -- config/events.json config/pta-meeting-occurrences.json config/fundraiser-occurrences.json config/hcpss-family-events.json config/announcements.json config/event-pages.json assets/flyers/ archive/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pages from config
        if: steps.diff.outputs.changed == 'true'
        run: python3 src/build.py

      - name: Validate generated pages
        if: steps.diff.outputs.changed == 'true'
        run: python3 test/validate_build.py

      - name: Commit config/events.json and regenerated pages
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "thespta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A config/events.json config/pta-meeting-occurrences.json config/fundraiser-occurrences.json config/hcpss-family-events.json config/announcements.json config/event-pages.json assets/flyers/ archive/ pages/
          git commit -m "chore: sync events from calendar, regenerate pages [skip ci]"
          git push

      - name: Assemble the deployed site
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p site/images site/flyers
          cp -r pages/. site/
          find assets/images -maxdepth 1 -type f ! -name "*.md" -exec cp {} site/images/ \;
          cp -r assets/flyers/. site/flyers/

      # See the identical step in deploy.yml for why this is gated on
      # github.repository rather than living in per-repo config: this
      # workflow file is pushed identically to both the production and
      # staging repos, and only the staging one should ever end up
      # indexable.
      - name: Block search/AI indexing on the staging mirror
        if: steps.diff.outputs.changed == 'true' && github.repository == 'techmaster-thespta/thespta-prestage'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          find site -name '*.html' -exec sed -i 's#</head>#<meta name="robots" content="noindex, nofollow">\n</head>#' {} \;

      - name: Upload Pages artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.diff.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
